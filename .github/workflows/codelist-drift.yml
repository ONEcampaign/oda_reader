name: OECD codelist drift

# Detects drift between the committed DAC area codelists and the live OECD source.
# Runs OFF the PR path (the live endpoint is an external dependency and must never
# block contributors). On a schedule it refreshes from the live source and, if the
# committed mappings are out of date, opens a pull request with the proposed diff
# for a maintainer to review and merge.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    name: Refresh and open PR on drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python 3.11
        run: uv python install '3.11'

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Refresh DAC codelists from the live OECD source
        run: uv run python -m scripts.data_maintenance.refresh_dac_codelists --write

      - name: Live codelist tests
        env:
          RUN_NETWORK_TESTS: "1"
        run: uv run pytest tests/codelists/network/ -m network

      - name: Open or update a tracking issue on failure
        # The refresh step raises a CodelistFetchError, CodelistSourceError or
        # CodelistShapeError (see src/oda_reader/exceptions.py) and exits non-zero;
        # this step never inspects which one — it points the responder at the run log
        # and lets them read the exception's own bounded, redacted body there. Search
        # for a fixed-title issue first so repeated weekly failures update one issue
        # instead of filing five (design doc section 10, step 3).
        if: failure()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const title = "OECD codelist drift refresh is failing";
            const runUrl = process.env.RUN_URL;
            const commentBody = `Failed again: ${runUrl}`;
            const issueBody = [
              `The scheduled refresh in \`codelist-drift.yml\` failed. See the [workflow run](${runUrl}) for the traceback.`,
              "",
              "Triage by the exception class in the run log (its message never includes the raw",
              "response body, but the exception object carries it, bounded to 64 KiB, for anyone",
              "who reproduces this locally):",
              "",
              "- `CodelistSourceError` — the OECD page moved, changed shape, or is blocking automated requests.",
              "- `CodelistShapeError` — the page responded, but its markup no longer matches what the handshake expects; needs a human to look at the diff.",
              "- `CodelistFetchError` — a transient failure; already retried three times before raising.",
            ].join("\n");

            const { owner, repo } = context.repo;
            const openIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: "automated",
            });
            const existing = openIssues.data.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: commentBody,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body: issueBody,
                labels: ["maintenance", "automated"],
              });
            }

      - name: Open a pull request if the codelists drifted
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-oecd-codelists
          base: main
          commit-message: "chore: refresh OECD DAC area codelists"
          title: "chore: refresh OECD DAC area codelists"
          body: |
            Automated refresh of the DAC area codelists from the live OECD source
            (`development-finance-codelists.oecd.org`).

            This PR exists because the committed `dac{1,2}_codes_area.json` are out of
            date with the live codelists. Review the diff before merging:

            - **Added** codes are new active DAC areas — confirm they look legitimate.
            - **Changed** values are codes whose `.stat` (dotstatcode) was updated
              upstream — confirm the change is intended (these affect translation output).
            - Historical codes are preserved (never deleted), so old data still translates.

            Merging runs the normal CI suite. If nothing here looks right, close the PR
            and investigate the source rather than merging.
          labels: |
            maintenance
            automated
          delete-branch: true
